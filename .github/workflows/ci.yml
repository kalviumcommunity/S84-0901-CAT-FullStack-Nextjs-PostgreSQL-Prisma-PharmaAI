name: CI PIPELINE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./pharma-research-ai

    env:
      # Provide a dummy DATABASE_URL so Prisma client generation succeeds during build.
      # The real value must be set as a repository secret for production deployments.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/pharma?sslmode=disable' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-build-only-placeholder-secret-32chars' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-placeholder' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './pharma-research-ai/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build
